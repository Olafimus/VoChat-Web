# Wird in nginx.conf eingebunden. Die CSP erlaubt nur eigene Skripte (keine Inline-Skripte),
# WebAssembly für Texterkennung/Sprachsynthese und Aufnahmen von Wikimedia Commons.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https://upload.wikimedia.org; connect-src 'self' https://upload.wikimedia.org; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

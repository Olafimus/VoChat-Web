services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vochat
      POSTGRES_USER: vochat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vochat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vochat -d vochat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vochat:${POSTGRES_PASSWORD:-vochat}@db:5432/vochat
      PORT: "8787"
      # Hinter nginx: X-Real-IP liefert die Client-Adresse (für die Ratenbegrenzung).
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      MEDIA_DRIVER: ${MEDIA_DRIVER:-local}
      MEDIA_LOCAL_DIR: /app/backend/data/media
      APP_SECRET: ${APP_SECRET:-}
      TTS_CACHE_DIR: /app/backend/data/media/tts-cache
      PUBLIC_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # E-Mail: none | console | smtp | gmail (siehe .env.example)
      MAIL_DRIVER: ${MAIL_DRIVER:-none}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_ALLOW_SELF_SIGNED: ${SMTP_ALLOW_SELF_SIGNED:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
    volumes:
      - media:/app/backend/data/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
